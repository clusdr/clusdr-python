[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clusdr"
version = "0.1.0"
description = "Application SDK for the local Clusdr daemon"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The clusdr Authors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "grpcio>=1.83.1",
    "protobuf>=7.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "grpcio-tools>=1.83.0",
]

[project.urls]
Homepage = "https://clusdr.io"
Documentation = "https://clusdr.io/docs/sdk/python"
Source = "https://github.com/durguto/clusdr-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clusdr = ["py.typed", "v1alpha1/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
