name: Bug report
description: Something in the Python SDK does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is the **Python client**. Daemon / `clusdr` CLI bugs go to [durguto/clusdr](https://github.com/durguto/clusdr/issues/new/choose).
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal program
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: `python --version`, `pip show clusdr`, and `clusdr version` if a daemon is running.
    validations:
      required: true
